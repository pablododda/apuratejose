name: Altura del Paraná cada hora

# Mira la estación del puerto cada 10 minutos y publica cuando hay un dato nuevo.
# Cada corrida dura unas 5 horas y media y al terminar se vuelve a lanzar sola,
# así no depende de la programación de GitHub (que a veces se atrasa o no arranca).
# La programación horaria queda de respaldo por si la cadena se corta.
on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: altura-horaria
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Mirar la estación cada 10 minutos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "apuratejose-bot"
          git config user.email "actions@users.noreply.github.com"
          fin=$(( $(date +%s) + 330*60 ))
          while [ $(date +%s) -lt $fin ]; do
            git fetch -q origin main && git reset -q --hard origin/main
            out=$(python3 fuente/agp_update.py || true)
            echo "$(date -u +%H:%M) $out"
            linea=$(echo "$out" | grep '^CAMBIO=' | tail -1)
            if [ "${linea:7:1}" = "1" ]; then
              python3 fuente/armar_sitio.py
              git add fuente/data index.html
              git commit -q -m "Datos: ${linea:9} (automático)" && git push -q origin HEAD:main || echo "no se pudo publicar; se reintenta en 10 minutos"
            fi
            sleep 600
          done
      - name: Volver a lanzarse
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run altura_horaria.yml --ref main --repo "$GITHUB_REPOSITORY"
